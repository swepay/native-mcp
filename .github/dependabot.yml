version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 10
    groups:
      dotnet-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # FluentAssertions 8.x relicensed to a commercial license + breaking API. Stay on 7.x.
      - dependency-name: "FluentAssertions"
        update-types: ["version-update:semver-major"]
      # Native.Mcp bundles a source generator; keep its Roslyn baseline on 4.x so consumers
      # are not forced onto a newer SDK/Roslyn. Major bumps are reviewed manually.
      - dependency-name: "Microsoft.CodeAnalysis.CSharp"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.CodeAnalysis.Analyzers"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "nuget"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "America/Sao_Paulo"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
