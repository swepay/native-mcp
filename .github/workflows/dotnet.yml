name: .NET

on:
  push:
    branches: [main, develop]
    tags:
      - "Native.Mcp-v*"
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal --settings coverlet.runsettings

      - name: Upload coverage reports
        uses: codecov/codecov-action@v6
        with:
          files: ./tests/**/coverage.cobertura.xml
          fail_ci_if_error: false

      - name: Pack NuGet packages
        # Native.Mcp.SourceGenerator is bundled inside the Native.Mcp package
        # (analyzers/dotnet/cs), so it is not published as a standalone package.
        run: |
          dotnet pack src/Native.Mcp/Native.Mcp.csproj --no-build --configuration Release --output ./nupkg
          dotnet pack src/Native.Mcp.Testing/Native.Mcp.Testing.csproj --no-build --configuration Release --output ./nupkg

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ./nupkg/*.nupkg

  publish:
    name: Publish to NuGet
    needs: build
    runs-on: ubuntu-latest
    # Only on a release tag push (e.g. Native.Mcp-v1.0.0), after build+tests pass.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/Native.Mcp-v')

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Pack NuGet packages
        # Native.Mcp.SourceGenerator ships bundled inside Native.Mcp (analyzers/dotnet/cs).
        run: |
          dotnet pack src/Native.Mcp/Native.Mcp.csproj --configuration Release --output ./nupkg
          dotnet pack src/Native.Mcp.Testing/Native.Mcp.Testing.csproj --configuration Release --output ./nupkg

      - name: Publish to NuGet.org
        run: >
          dotnet nuget push ./nupkg/*.nupkg
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
